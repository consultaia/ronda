<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ronda — sua visita, já evoluída</title>
<meta name="theme-color" content="#1E6B58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ronda">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --papel:#E7EDE8;
    --superficie:#FFFFFF;
    --tinta:#0E1C17;
    --tinta-fraca:#5C6F68;
    --linha:#D3DCD5;
    --verde:#1E6B58;
    --verde-claro:#DDEBE5;
    --ambar:#B26A00;
    --ambar-claro:#F8ECD9;
    --vermelho:#B3261E;
    --vermelho-claro:#F7E1DF;
    --azul:#1C5A8C;
    --azul-claro:#DEEAF3;
    --violeta:#6B4E9E;
    --violeta-claro:#E9E2F4;
    --raio:10px;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--papel);color:var(--tinta);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  :focus-visible{outline:2px solid var(--verde);outline-offset:2px;border-radius:4px}

  .app{max-width:1400px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

  /* ---------- cabecalho ---------- */
  .topo{
    position:sticky;top:0;z-index:20;background:var(--papel);
    border-bottom:1px solid var(--linha);padding:12px 16px;
    display:flex;align-items:center;gap:12px;
  }
  .marca{font-weight:800;letter-spacing:-.03em;font-size:19px}
  .marca span{color:var(--verde)}
  .topo-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--tinta-fraca);margin-left:auto;text-align:right}
  .voltar{font-family:var(--mono);font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--verde);font-weight:600}

  /* ---------- chips de status ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    white-space:nowrap;border:1px solid var(--linha);background:var(--superficie);
    padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--tinta-fraca);
  }
  .chip[data-on="1"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
  .chip b{font-family:var(--mono);font-weight:700;margin-left:5px;opacity:.65}

  /* ---------- quadro ---------- */
  .quadro{flex:1;padding:0 16px 100px}
  .colunas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding-bottom:16px;
    align-items:stretch;min-height:calc(100dvh - 230px)}
  @media(max-width:1180px){.colunas{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .coluna{background:rgba(255,255,255,.5);border:1px solid var(--linha);border-radius:var(--raio);
    padding:10px;min-width:0;transition:background .12s,border-color .12s}
  .lista-larga{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
  .coluna-tit{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--tinta-fraca);padding:2px 4px 10px;display:flex;justify-content:space-between;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .coluna .vazio{padding:22px 10px;font-size:12.5px}

  .cartao{
    width:100%;text-align:left;background:var(--superficie);border:1px solid var(--linha);
    border-radius:var(--raio);padding:12px 12px;margin-bottom:10px;display:flex;gap:11px;
    align-items:flex-start;transition:border-color .12s,transform .12s,opacity .12s;cursor:pointer;position:relative;
  }
  .estrela{position:absolute;top:6px;right:8px;font-size:18px;line-height:1;color:var(--tinta-fraca);padding:4px}
  .estrela[data-on="1"]{color:var(--ambar)}
  .aba.arq{border-style:dashed;color:var(--tinta-fraca)}
  .aba.arq[data-on="1"]{background:var(--tinta);color:#fff;border-style:solid}
  .cartao:hover{border-color:var(--verde)}
  .cartao:active{transform:scale(.995)}
  .leito{
    flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:-.02em;
    background:var(--papel);border:1px solid var(--linha);border-radius:7px;
    padding:7px 9px;min-width:52px;text-align:center;line-height:1.1;
  }
  .leito small{display:block;font-size:8.5px;letter-spacing:.1em;font-weight:600;
    color:var(--tinta-fraca);margin-bottom:2px}
  .cartao-corpo{flex:1;min-width:0}
  .cartao-nome{font-weight:700;letter-spacing:-.01em}
  .cartao-nome em{font-style:normal;font-family:var(--mono);font-size:12px;
    color:var(--tinta-fraca);font-weight:600;margin-left:6px}
  .cartao-dx{font-size:13px;color:var(--tinta-fraca);margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pulseiras{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .pulseira{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;padding:3px 7px;border-radius:4px}
  .p-queda{background:var(--ambar-claro);color:var(--ambar)}
  .p-alergia{background:var(--vermelho-claro);color:var(--vermelho)}
  .p-lpp{background:var(--violeta-claro);color:var(--violeta)}
  .p-pend{background:var(--azul-claro);color:var(--azul)}
  .p-dih{background:var(--verde-claro);color:var(--verde)}

  /* ---------- botoes ---------- */
  .btn{background:var(--verde);color:#fff;border-radius:8px;padding:12px 18px;
    font-weight:650;letter-spacing:-.01em;display:inline-flex;align-items:center;
    justify-content:center;gap:8px;transition:filter .12s}
  .btn:hover{filter:brightness(1.08)}
  .btn.sec{background:var(--superficie);color:var(--tinta);border:1px solid var(--linha)}
  .btn.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
  .btn:disabled{opacity:.45;cursor:default}
  .barra{
    position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--papel);
    border-top:1px solid var(--linha);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:10px;
  }
  .barra .btn{flex:1}

  /* ---------- ficha do paciente ---------- */
  .ficha{padding:16px 16px 110px;max-width:820px;margin:0 auto;width:100%}
  .ficha-topo{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
  .ficha h1{font-size:25px;letter-spacing:-.03em;line-height:1.15}
  .ficha-meta{font-family:var(--mono);font-size:12px;color:var(--tinta-fraca);margin-top:3px}
  .secao-tit{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--tinta-fraca);margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--linha);
    display:flex;justify-content:space-between;align-items:center}
  .secao-tit button{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--verde);font-weight:700}

  .item{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);
    padding:12px 14px;margin-bottom:9px}
  .item-cab{display:flex;justify-content:space-between;gap:10px;
    font-family:var(--mono);font-size:11px;color:var(--tinta-fraca);margin-bottom:5px}
  .item p{font-size:14px;white-space:pre-wrap}
  .pend{display:flex;gap:11px;align-items:flex-start}
  .pend input{margin-top:3px;width:17px;height:17px;accent-color:var(--verde)}
  .pend.feito span{text-decoration:line-through;color:var(--tinta-fraca)}
  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .fotos figure{border:1px solid var(--linha);border-radius:8px;overflow:hidden;background:var(--superficie)}
  .fotos img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
  .fotos figcaption{font-family:var(--mono);font-size:9.5px;color:var(--tinta-fraca);padding:4px 6px}
  .vazio{font-size:13.5px;color:var(--tinta-fraca);padding:14px;text-align:center;
    border:1px dashed var(--linha);border-radius:var(--raio)}

  /* ---------- formulario ---------- */
  .form{padding:16px 16px 110px;max-width:820px;margin:0 auto;width:100%}
  fieldset{border:none;margin-bottom:22px}
  legend{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--tinta-fraca);padding-bottom:8px;margin-bottom:10px;width:100%;
    border-bottom:1px solid var(--linha)}
  .campo{margin-bottom:14px}
  .campo-lab{font-size:12.5px;font-weight:650;color:var(--tinta-fraca);margin-bottom:7px;display:block}
  .opcoes{display:flex;flex-wrap:wrap;gap:7px}
  .op{border:1px solid var(--linha);background:var(--superficie);border-radius:8px;
    padding:9px 13px;font-size:13.5px;text-align:left;transition:all .12s;line-height:1.35}
  .op[data-on="1"]{background:var(--verde-claro);border-color:var(--verde);
    color:var(--verde);font-weight:650}
  .linha-num{display:flex;flex-wrap:wrap;gap:8px}
  .num{flex:1;min-width:110px}
  .num label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--tinta-fraca);margin-bottom:4px}
  input[type=text],input[type=number],textarea,select{
    width:100%;background:var(--superficie);border:1px solid var(--linha);
    border-radius:8px;padding:10px 12px;font-size:15px}
  textarea{resize:vertical;min-height:74px}

  /* ---------- SIGNATURE: folha de evolucao ---------- */
  .folha{
    background:
      repeating-linear-gradient(to bottom,transparent 0 25px,rgba(30,107,88,.07) 25px 26px),
      var(--superficie);
    border:1px solid var(--linha);border-left:3px solid var(--verde);
    border-radius:4px;padding:20px 18px;
    font-family:var(--mono);font-size:12.5px;line-height:26px;
    white-space:pre-wrap;word-break:break-word;
    animation:imprime .3s ease-out;
  }
  @keyframes imprime{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .folha-cab{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--tinta-fraca);display:flex;justify-content:space-between;margin-bottom:8px}
  .aviso{font-size:12.5px;color:var(--tinta-fraca);background:var(--ambar-claro);
    border:1px solid #EBD5B4;border-radius:8px;padding:10px 12px;margin-top:12px}
  .aviso.alerta{background:var(--vermelho-claro);border-color:#E9C4C1;
    color:var(--vermelho);font-weight:600}
  .evo-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .evo-acoes{display:flex;gap:6px;flex-wrap:wrap}
  .link{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--verde);font-weight:700;padding:6px 8px;border-radius:6px;background:var(--verde-claro)}
  .passos{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .passos::-webkit-scrollbar{display:none}
  .passo{flex:0 0 auto;width:34px;height:34px;border-radius:999px;border:1px solid var(--linha);
    background:var(--superficie);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:12px;font-weight:700;color:var(--tinta-fraca)}
  .passo[data-ok="1"]{background:var(--verde-claro);border-color:var(--verde);color:var(--verde)}
  .passo[data-on="1"]{background:var(--tinta);border-color:var(--tinta);color:#fff;transform:scale(1.08)}
  .passo-tit{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px;display:flex;
    justify-content:space-between;align-items:baseline}
  .passo-tit small{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--tinta-fraca);font-weight:600}
  @media(max-width:899px){
    .op{padding:12px 15px;font-size:14.5px}       /* alvo de toque maior */
    .form fieldset{margin-bottom:8px}
  }
  .abas{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;align-items:center}
  .abas::-webkit-scrollbar{display:none}
  .aba{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;
    border:1px solid var(--linha);background:var(--superficie);font-weight:650;font-size:13.5px;color:var(--tinta-fraca);
    transition:all .12s}
  .aba b{font-family:var(--mono);font-weight:700;opacity:.6}
  .aba-ico{font-size:14px}
  .aba[data-on="1"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
  .aba[data-on="1"] b{opacity:.8}
  .aba[data-sobre="1"]{background:var(--verde-claro);border-color:var(--verde);color:var(--verde);transform:scale(1.04);
    box-shadow:0 0 0 4px var(--verde-claro)}
  .aba.nova{border-style:dashed;color:var(--verde);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .aba-dica{font-family:var(--mono);font-size:11px;color:var(--tinta-fraca);margin-left:6px;white-space:nowrap}
  .cartao[draggable="true"]{cursor:grab}
  .cartao[data-arrastando="1"]{opacity:.4;transform:rotate(-1.5deg)}
  .coluna[data-sobre="1"]{background:var(--verde-claro);border-color:var(--verde)}
  .coluna[data-sobre="1"] .vazio{border-color:var(--verde);color:var(--verde)}
  .campo-pa{flex:1 1 100%}
  .pa-linha{display:flex;align-items:center;gap:8px}
  .pa-linha input{width:88px;flex:0 0 auto;text-align:center;font-family:var(--mono);font-size:16px}
  .pa-x{font-family:var(--mono);color:var(--tinta-fraca);font-size:15px;font-weight:700}
  .pa-pam{margin-left:6px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--tinta-fraca);padding:8px 12px;border-radius:8px;
    background:var(--papel);border:1px dashed var(--linha);white-space:nowrap}
  .pa-pam[data-on="1"]{background:var(--verde-claro);border:1px solid var(--verde);color:var(--verde)}
  .pa-pam b{font-size:15px;margin-left:4px}

  .disp-item{display:flex;align-items:center;gap:10px}
  .disp-item>div:first-child{flex:1;min-width:0}
  .x{font-size:20px;line-height:1;color:var(--tinta-fraca);padding:4px 8px;border-radius:6px}
  .x:hover{color:var(--vermelho);background:var(--vermelho-claro)}
  .fotos figcaption .x{font-size:14px;padding:0 4px}
  .onboard input{margin-bottom:0}
  select{appearance:auto}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:50;
    background:var(--tinta);color:#fff;padding:10px 18px;border-radius:999px;
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

  /* ---------- modal ---------- */
  .fundo{position:fixed;inset:0;background:rgba(14,28,23,.45);z-index:60;
    display:flex;align-items:flex-end;justify-content:center}
  .modal{background:var(--papel);border-radius:16px 16px 0 0;padding:20px 16px 24px;
    width:100%;max-width:560px;max-height:88dvh;overflow-y:auto}
  .modal h2{font-size:19px;letter-spacing:-.02em;margin-bottom:14px}

  .carregando{min-height:100dvh;display:flex;align-items:center;justify-content:center}
  .carregando .marca{font-size:30px;font-weight:800;letter-spacing:-.03em;opacity:.5;
    animation:pulsa 1.2s ease-in-out infinite}

  .onboard{flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:24px 20px;max-width:440px;margin:0 auto;width:100%}
  .onboard-sub{color:var(--tinta-fraca);font-size:15px;margin-bottom:26px}
  .onboard-rodape{color:var(--tinta-fraca);font-size:12.5px;text-align:center;margin-top:18px}
  .perfil{width:100%;text-align:left;background:var(--superficie);border:1px solid var(--linha);
    border-radius:14px;padding:20px;margin-bottom:12px;display:grid;
    grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;
    transition:border-color .12s,transform .12s}
  .perfil:hover{border-color:var(--verde)}
  .perfil[data-on="1"]{border-color:var(--verde);background:var(--verde-claro)}
  .perfil:active{transform:scale(.99)}
  .perfil-emoji{grid-row:1/3;font-size:32px;align-self:center}
  .perfil-nome{font-weight:700;font-size:17px;letter-spacing:-.01em}
  .perfil-desc{font-size:13px;color:var(--tinta-fraca);line-height:1.4}

  .perfil-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--tinta-fraca);font-weight:600;padding:4px 0}
  @keyframes pulsa{0%,100%{opacity:.35}50%{opacity:.7}}

  .selo{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;
    background:var(--verde-claro);color:var(--verde);border:1px solid transparent}
  .selo[data-urg="1"]{background:var(--ambar-claro);color:var(--ambar)}
  .topo .selo + .topo-sub{margin-left:12px}

  .plano{width:100%;text-align:left;background:var(--superficie);border:1px solid var(--linha);
    border-radius:var(--raio);padding:15px 16px;margin-bottom:10px;transition:border-color .12s}
  .plano:hover{border-color:var(--verde)}
  .plano-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .plano-nome{font-weight:700;font-size:16px;letter-spacing:-.01em}
  .plano-selo{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;background:var(--verde);color:#fff;padding:3px 8px;border-radius:5px}
  .plano-preco{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--verde)}
  .plano-preco small{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:0;
    color:var(--tinta-fraca);margin-left:6px}

  .qr-fake{aspect-ratio:1;max-width:230px;margin:6px auto 0;border:1px solid var(--linha);
    border-radius:12px;background:var(--superficie);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;position:relative;overflow:hidden}
  .qr-fake span{font-family:var(--mono);font-size:11px;color:var(--tinta-fraca);text-align:center;
    line-height:1.5;z-index:1;padding:0 20px}
  .qr-grade{position:absolute;inset:18px;border-radius:6px;opacity:.09;
    background-image:
      repeating-linear-gradient(0deg,var(--tinta) 0 8px,transparent 8px 16px),
      repeating-linear-gradient(90deg,var(--tinta) 0 8px,transparent 8px 16px)}

  @media(min-width:760px){
    .fundo{align-items:center}
    .modal{border-radius:16px}
    .barra{position:sticky;border-radius:0}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>

<script type="text/babel">
const {useState,useMemo,useRef,useEffect} = React;

/* ============================================================
   NUVEM — Firebase, projeto consultaia-f2902 (o mesmo do MedScribe).
   Mesmo login, mesma lista de acesso (usuarios_autorizados).
   Pacientes em ronda_pacientes, perfil em ronda_usuarios,

const COL_PAC='ronda_pacientes', COL_USU='ronda_usuarios', COL_EQ='ronda_equipes', COL_CONV='ronda_convites';
const mapa=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const gerarCodigo=()=>{ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<6;i++) c+=a[Math.floor(Math.random()*a.length)]; return c; };
const nuvem = {
  // Meus pacientes (inclusive os que coloquei em equipes)
  ouvirMeus(uid,cb,erro){
    return store.collection(COL_PAC).where('userId','==',uid).onSnapshot(s=>cb(mapa(s)), erro);
  },
  // Pacientes de uma equipe (criados por qualquer membro)
  ouvirEquipe(equipeId,cb,erro){
    return store.collection(COL_PAC).where('equipeId','==',equipeId).onSnapshot(s=>cb(mapa(s)), erro);
  },
  // Equipes das quais sou membro
  ouvirEquipes(uid,cb,erro){
    return store.collection(COL_EQ).where('membros','array-contains',uid).onSnapshot(s=>cb(mapa(s)), erro);
  },
  async criarEquipe(uid,email,nome){
    const codigo=gerarCodigo(), ref=store.collection(COL_EQ).doc();
    const lote=store.batch();
    lote.set(ref,{nome,codigo,donoUid:uid,membros:[uid],membrosInfo:{[uid]:{email}},criadoEm:Date.now()});
    lote.set(store.collection(COL_CONV).doc(codigo),{equipeId:ref.id,nome});
    await lote.commit(); return {id:ref.id,codigo};
  },
  async entrarEquipe(codigo,uid,email){
    const c=await store.collection(COL_CONV).doc(codigo.trim().toUpperCase()).get();
    if(!c.exists) throw new Error('Código não encontrado.');
    const {equipeId,nome}=c.data();
    await store.collection(COL_EQ).doc(equipeId).update({
      membros:firebase.firestore.FieldValue.arrayUnion(uid),
      ['membrosInfo.'+uid]:{email},
    });
    return nome;
  },
  sairEquipe(equipeId,uid){
    return store.collection(COL_EQ).doc(equipeId).update({
      membros:firebase.firestore.FieldValue.arrayRemove(uid),
      ['membrosInfo.'+uid]:firebase.firestore.FieldValue.delete(),
    });
  },
  salvarPaciente(uid,p){
    const {id,...dados}=p;
    // quem criou continua dono; membro da equipe edita sem tomar a posse
    return store.collection(COL_PAC).doc(id).set({...dados,userId:dados.userId||uid,equipeId:dados.equipeId||null,atualizadoEm:Date.now()});
  },
  removerPaciente(id){ return store.collection(COL_PAC).doc(id).delete(); },
  async lerUsuario(uid){ const d=await store.collection(COL_USU).doc(uid).get(); return d.exists?d.data():null; },
  salvarUsuario(uid,dados){ return store.collection(COL_USU).doc(uid).set(dados,{merge:true}); },
  async subirFoto(uid,pid,fid,blob){
    const ref=storage.ref('ronda/'+uid+'/'+pid+'/'+fid+'.webp');
    await ref.put(blob,{contentType:'image/webp'});
    return {caminho:ref.fullPath, url:await ref.getDownloadURL()};
  },
  apagarFoto(caminho){ return storage.ref(caminho).delete().catch(()=>{}); },
  async autorizado(email){
    try{ const d=await store.collection('usuarios_autorizados').doc(email).get();
         return d.exists && d.data().ativo===true; }
    catch(e){ console.warn('acesso:',e.message); return false; }
  },
};

/* ============================================================
   GERADORES DE TEXTO
   ============================================================ */
// Regra: o que esta entre parenteses e opcional. Se o campo nao foi preenchido,
// o parentese inteiro some em vez de virar "(D____)". Fora de parenteses, a
// lacuna permanece visivel de proposito — e informacao que faltou.
function preencher(tpl,v){
  const cheio=tpl.replace(/\{(\w+)\}/g,(_,k)=>{
    const val=v[k];
    return (val===undefined||val===null||val==='') ? '____' : String(val);
  });
  return cheio.replace(/\s*\([^()]*____[^()]*\)/g,'').replace(/\s{2,}/g,' ').trim();
}
function maiuscula(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

// Fragmentos marcados com \u0001 se colam ao anterior por espaco, nao por virgula.
const COLA='\u0001';
function fragmentos(secao,v){
  const out=[];
  secao.campos.forEach(c=>{
    if(c.tipo==='radio'){
      const o=(c.opts||[]).find(o=>o.v===v[c.id]);
      if(o&&o.t) out.push((o.s?COLA:'')+preencher(o.t,v));
    } else if(c.tipo==='check'){
      (v[c.id]||[]).forEach(sel=>{
        const o=(c.opts||[]).find(o=>o.v===sel);
        if(o&&o.t) out.push((o.s?COLA:'')+preencher(o.t,v));
      });
    } else if(c.t && v[c.id]!==undefined && v[c.id]!==''){
      out.push(preencher(c.t,v));
    }
  });
  return out;
}
const limpo = x => x.charAt(0)===COLA ? x.slice(1) : x;
function juntar(arr,sep=', '){
  return arr.map((x,i)=>{
    const cola = x.charAt(0)===COLA;
    return (i===0?'':(cola?' ':sep)) + limpo(x);
  }).join('');
}
// PA digitada como 120X80, 120 x 80 ou 120/80 sai sempre igual.
function normalizar(v){
  const o={...v};
  // PA agora vem de duas caixas (pas/pad); calcula PAM e monta os campos derivados.
  const temPAS=o.pas!==''&&o.pas!=null, temPAD=o.pad!==''&&o.pad!=null;
  if(temPAS&&temPAD){
    o.pam=Math.round((Number(o.pas)+2*Number(o.pad))/3);
    o.pa=o.pas+'x'+o.pad;
  } else if(o.pa){
    o.pa=String(o.pa).replace(/\s/g,'').replace(/[xX×\/]/,'x');
  }
  return o;
}

function cabecalho(p){
  const d=new Date();
  const data=d.toLocaleDateString('pt-BR');
  const hora=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const dih=diasDe(p.admissao);
  return {data,hora,dih};
}
function diasDe(iso){
  if(!iso) return null;
  const ms=Date.now()-new Date(iso+'T00:00:00').getTime();
  return Math.max(1,Math.floor(ms/86400000)+1);
}

/* Coleta os fragmentos por bloco narrativo, nao pela ordem do formulario.
   O formulario e agrupado por sistema (como o enfermeiro pensa);
   o texto sai na ordem da evolucao corrida (como o enfermeiro escreve). */
function coletar(v){
  const mapa={};
  SAE.forEach(sec=>{
    sec.campos.forEach(c=>{
      const add=(bal,txt)=>{
        if(!txt) return;
        const lista=(mapa[bal]=mapa[bal]||[]);
        const ultimo=lista[lista.length-1];
        if(ultimo&&ultimo.sec===sec.id) ultimo.frags.push(txt);
        else lista.push({sec:sec.id,frags:[txt]});
      };
      if(c.tipo==='radio'){
        const o=(c.opts||[]).find(o=>o.v===v[c.id]);
        if(o&&o.t) add(o.b||c.b||'exame',(o.s?COLA:'')+preencher(o.t,v));
      } else if(c.tipo==='check'){
        (v[c.id]||[]).forEach(sel=>{
          const o=(c.opts||[]).find(o=>o.v===sel);
          if(o&&o.t) add(o.b||c.b||'exame',(o.s?COLA:'')+preencher(o.t,v));
        });
      } else if(c.t && v[c.id]!==undefined && v[c.id]!==''){
        add(c.b||'exame',preencher(c.t,v));
      }
    });
  });
  return mapa;
}
const grupo  = (m,b) => m[b]||[];
const planos = (m,b) => grupo(m,b).reduce((a,g)=>a.concat(g.frags),[]);
function listaE(arr){
  const a=arr.map(limpo);
  if(a.length<=1) return a.join('');
  return a.slice(0,-1).join(', ')+' e '+a[a.length-1];
}

function gerarSAE(p,vBruto,comSAE){
  const v=normalizar(vBruto);
  const {data,hora,dih}=cabecalho(p);
  const m=coletar(v);
  const L=[];

  if(comSAE) L.push('EVOLUÇÃO DE ENFERMAGEM');
  L.push(data+' às '+hora+'. Paciente '+p.iniciais+(p.idade?', '+p.idade+' anos':'')+
         ', leito '+p.leito+(dih?', '+dih+'º dia de internação':'')+
         (p.dx?' por '+p.dx:'')+'.');
  if(p.alergia) L.push('Alergia relatada: '+p.alergia+'.');
  L.push('');

  const corpo=[];

  // 1. abertura: consciencia + queixas subjetivas + negativas
  const ab=planos(m,'abertura'), q=planos(m,'queixa'), ng=planos(m,'nega');
  if(ab.length||q.length||ng.length){
    let s = ab.length ? maiuscula(juntar(ab)) : 'Paciente';
    if(q.length) s += ', queixa-se de '+listaE(q);
    if(ng.length) s += '; '+juntar(ng);
    corpo.push(s+'.');
  }

  // 2. exame fisico, no sentido cefalocaudal, uma frase por sistema
  const ex=grupo(m,'exame');
  if(ex.length){
    let t=ex.map(g=>maiuscula(juntar(g.frags))+'.').join(' ');
    corpo.push('Ao exame físico: '+t.charAt(0).toLowerCase()+t.slice(1));
  }

  // 3. eliminacoes, pele, dispositivos, seguranca, apoio
  ['elim','pele','disp','seg','psico'].forEach(b=>{
    grupo(m,b).forEach(g=>corpo.push(maiuscula(juntar(g.frags))+'.'));
  });

  // 4. fechamento com os cuidados do periodo
  const fim=planos(m,'fim');
  corpo.push('Segue sob cuidados de enfermagem'+
             (fim.length?', com '+listaE(fim):'')+', sem intercorrências.');

  L.push(corpo.join(' '));
  if(v.obs){ L.push(''); L.push(v.obs); }

  if(comSAE){
    const dx=NANDA.filter(r=>{ try{return r.q(v)}catch(e){return false} })
                  .sort((a,b)=>peso(a.d)-peso(b.d));
    if(dx.length){
      L.push('');
      L.push('DIAGNÓSTICOS DE ENFERMAGEM E PRESCRIÇÃO (NANDA-I)');
      dx.forEach((r,i)=>{
        L.push((i+1)+'. '+r.d);
        r.i.forEach(x=>L.push('   - '+x));
      });
    }
    L.push('');
    L.push('Enf. ______________________________  COREN ______________');
  }
  return L.join('\n');
}

/* --- dispositivos e antibioticos do cadastro, com contagem de dias --- */
function diasDesde(iso){
  if(!iso) return null;
  const ms=Date.now()-new Date(iso+'T00:00:00').getTime();
  return Math.max(1,Math.floor(ms/DIA)+1);
}
function dispositivosTexto(p){
  return (p.dispositivos||[]).map(d=>{
    const def=DISPOSITIVOS.find(x=>x.v===d.tipo)||{sigla:d.tipo};
    const n=diasDesde(d.desde);
    return def.sigla+(d.local?' '+d.local:'')+(n?' (D'+n+')':'');
  }).join(', ');
}
function antibioticosTexto(p){
  return (p.antibioticos||[]).map(a=>{
    const n=diasDesde(a.desde);
    return a.nome+(n?' (D'+n+')':'');
  }).join(', ');
}
// Pre-carrega o formulario com o que o cadastro ja sabe do paciente.
function prefill(p,tipo){
  const v={};
  const tem=t=>(p.dispositivos||[]).find(d=>d.tipo===t);
  if(tipo==='enfermagem'){
    const ch=[];
    if(tem('avp')){ ch.push('avp'); const d=tem('avp'); if(d.local) v.avpLocal=d.local; const n=diasDesde(d.desde); if(n) v.avpDias=String(n); }
    if(tem('cvc')||tem('picc')||tem('hd')) ch.push('cvc');
    if(tem('svd')){ ch.push('svd'); const n=diasDesde(tem('svd').desde); if(n) v.svdDias=String(n); }
    if(tem('sne')) ch.push('sne');
    if(tem('dreno')){ ch.push('dreno'); const d=tem('dreno'); if(d.local) v.drenoLocal=d.local; }
    if(tem('tot')) ch.push('tot');
    if(ch.length) v.dispch=ch;
    if(p.lpp) v.pelach=['lpp'];
  } else {
    if(p.status==='uti'){ if(tem('tot')||tem('tqt')) v.o2s='vm'; }
    if(p.antibioticos&&p.antibioticos.length) v.plano=['atb'];
  }
  return v;
}

function campoSOAP(secId,campoId,v){
  const sec=SOAP.find(s=>s.id===secId); if(!sec) return [];
  const c=sec.campos.find(x=>x.id===campoId); if(!c) return [];
  if(c.tipo==='radio'){
    const o=(c.opts||[]).find(o=>o.v===v[c.id]);
    return (o&&o.t)?[preencher(o.t,v)]:[];
  }
  if(c.tipo==='check'){
    return (v[c.id]||[]).map(sel=>{
      const o=(c.opts||[]).find(o=>o.v===sel);
      return (o&&o.t)?preencher(o.t,v):'';
    }).filter(Boolean);
  }
  return (c.t && v[c.id]!==undefined && v[c.id]!=='')?[preencher(c.t,v)]:[];
}

function gerarSOAP(p,vBruto,comAssinatura){
  const v=normalizar(vBruto);
  const {data,hora,dih}=cabecalho(p);
  const um=(s,c)=>campoSOAP(s,c,v)[0]||'';
  const L=[];

  L.push(data+' às '+hora+'. Paciente '+p.iniciais+(p.idade?', '+p.idade+'a':'')+
         ', leito '+p.leito+(dih?', '+dih+'º DIH':'')+'.'+(p.dx?' '+p.dx+'.':''));
  if(p.alergia) L.push('Alergia: '+p.alergia+'.');
  L.push('');

  // S
  const sQ=campoSOAP('s','sub',v), sD=um('s','aceit');
  const s=[sQ.length?listaE(sQ):'', sD].filter(Boolean).join(', ');
  L.push('S: '+(s?maiuscula(s)+'.':'____')+(v.slivre?' '+v.slivre:''));
  L.push('');

  // O — sinais vitais, exame por aparelho, dispositivos, exames
  const vitais=['pa','fc','fr','tax','sat','hgt','diu','bh']
    .reduce((a,k)=>a.concat(campoSOAP('vit',k,v)),[]);

  const neuro=[um('ef','neuro'),um('ef','forca'),um('ef','glasgow')].filter(Boolean).join(', ');
  const sistemas=[['geral',''],['ap','AP: '],['acv','ACV: '],['abd','ABD: '],
                  ['mmii','MMII: '],['pele','PELE: ']]
    .map(([k,pre])=>{const t=um('ef',k); return t?pre+t:'';}).filter(Boolean);
  if(neuro) sistemas.push('NEURO: '+neuro);

  // Dispositivos e antibioticos vem do cadastro do paciente, com dias contados pelo app.
  const disp=dispositivosTexto(p);
  const atbs=antibioticosTexto(p);
  const terap=campoSOAP('disp','profil',v);
  const o2=um('disp','o2s');
  const utiL=[
    um('uti','rass'),
    (campoSOAP('uti','sed',v).length? 'sedação com '+campoSOAP('uti','sed',v).join(', '):''),
    (campoSOAP('uti','dva',v).length? campoSOAP('uti','dva',v).join(', '):'sem droga vasoativa'),
    um('uti','lact'), um('uti','renal'),
  ].filter(Boolean);
  const bundle=campoSOAP('uti','metas',v);
  const usaUTI = p.status==='uti' || v.rass || (v.dva&&v.dva.length) || (v.sed&&v.sed.length);

  const linhas=[];
  if(vitais.length)   linhas.push(vitais.join(' | '));
  if(o2)              linhas.push(maiuscula(o2)+'.');
  if(usaUTI&&utiL.length) linhas.push('UTI: '+utiL.join('; ')+'.');
  if(sistemas.length) linhas.push(sistemas.join('. ')+'.');
  if(v.efalt)         linhas.push('Outros achados: '+v.efalt);
  if(disp)            linhas.push('Dispositivos: '+disp+'.');
  if(atbs)            linhas.push('ATB: '+atbs+'.');
  if(terap.length)    linhas.push('Profilaxias: '+terap.join('; ')+'.');
  if(usaUTI&&bundle.length) linhas.push('Bundle: '+bundle.join('; ')+'.');
  if(v.lab)           linhas.push('Laboratório: '+v.lab);
  if(v.img)           linhas.push('Imagem: '+v.img);
  if(v.cult)          linhas.push('Culturas: '+v.cult);

  if(linhas.length){ L.push('O: '+linhas[0]); linhas.slice(1).forEach(x=>L.push('   '+x)); }
  else L.push('O: ____');
  L.push('');

  // A
  const av=um('a','aval');
  L.push('A: '+(av?av+'.':'____')+
         (v.problemas?' Problemas ativos: '+v.problemas+'.':'')+
         (v.alivre?' '+v.alivre:''));
  L.push('');

  // P
  const plano=campoSOAP('p','plano',v).map(x=>
    x.startsWith('Mantida antibioticoterapia')&&atbs ? 'Mantida antibioticoterapia: '+atbs : x);
  if(plano.length||v.plivre){
    L.push('P:');
    plano.forEach(x=>L.push('   - '+x+'.'));
    if(v.plivre) L.push('   - '+v.plivre);
  } else L.push('P: ____');

  if(comAssinatura){
    L.push('');
    L.push('Dr(a). ______________________________  CRM ______________');
  }
  return L.join('\n');
}

function gerarPassagem(pacientes,perfil){
  const tipoAlvo = perfil==='medica' ? 'médica' : 'enfermagem';
  const titulo = perfil==='medica' ? 'PASSAGEM DE PLANTÃO MÉDICO' : 'PASSAGEM DE PLANTÃO DE ENFERMAGEM';
  const L=[titulo+' — '+new Date().toLocaleDateString('pt-BR')+' às '+
           new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),''];
  const ordem=[...pacientes].sort((a,b)=>String(a.leito).localeCompare(String(b.leito),'pt',{numeric:true}));
  ordem.forEach(p=>{
    const dih=diasDe(p.admissao);
    const st=(STATUS.find(x=>x.v===p.status)||{}).l;
    L.push('LEITO '+p.leito+' — '+p.iniciais+(p.idade?', '+p.idade+'a':'')+(dih?', '+dih+'º DIH':'')+(st&&p.status!=='ativo'?' — '+st.toUpperCase():''));
    if(p.dx) L.push('  Dx: '+p.dx);
    if(p.problemas) L.push('  Problemas: '+p.problemas.split('\n').filter(Boolean).join('; '));
    if(p.alergia) L.push('  ALERGIA: '+p.alergia);
    const dsp=dispositivosTexto(p), atb=antibioticosTexto(p);
    if(dsp) L.push('  Dispositivos: '+dsp);
    if(atb) L.push('  ATB: '+atb);
    const ult=(p.evolucoes||[]).find(e=>e.tipo===tipoAlvo);
    if(ult) L.push('  Última evolução ('+new Date(ult.quando).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+'): '+ult.resumo);
    const nota=(p.evolucoes||[]).find(e=>e.tipo==='nota');
    if(nota) L.push('  Nota: '+nota.texto);
    const abertas=(p.pendencias||[]).filter(x=>!x.feito);
    if(abertas.length) L.push('  Pendências: '+abertas.map(x=>x.texto).join('; '));
    L.push('');
  });
  return L.join('\n');
}

/* ============================================================
   UTILITARIOS
   ============================================================ */
async function copiar(texto){
  try{ await navigator.clipboard.writeText(texto); return true; }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=texto; ta.style.position='fixed'; ta.style.top='-2000px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

// Comprime no cliente: ~1280px, WebP 0.7 -> 100-200 KB, e remove EXIF de brinde.
function comprimir(file,maxLado=1280,q=0.72){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height;
      const esc=Math.min(1,maxLado/Math.max(w,h));
      w=Math.round(w*esc); h=Math.round(h*esc);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('compressão falhou')),'image/webp',q);
    };
    img.onerror=rej; img.src=url;
  });
}

const uid_=()=>Math.random().toString(36).slice(2,10);

   COMPONENTES
   ============================================================ */
function Campo({c,v,set}){
  if(c.tipo==='radio'||c.tipo==='check'){
    const multi=c.tipo==='check';
    const atual=multi?(v[c.id]||[]):v[c.id];
    return (
      <div className="campo">
        <span className="campo-lab">{c.lab}</span>
        <div className="opcoes">
          {c.opts.map(o=>{
            const on=multi?atual.includes(o.v):atual===o.v;
            return <button key={o.v} className="op" data-on={on?'1':'0'}
              aria-pressed={on}
              onClick={()=>{
                if(multi) set(c.id, on?atual.filter(x=>x!==o.v):[...atual,o.v]);
                else set(c.id, on?undefined:o.v);
              }}>{o.l}</button>;
          })}
        </div>
      </div>
    );
  }
  if(c.tipo==='area'){
    return (
      <div className="campo">
        <span className="campo-lab">{c.lab}</span>
        <textarea value={v[c.id]||''} onChange={e=>set(c.id,e.target.value)}/>
      </div>
    );
  }
  if(c.tipo==='pa'){
    const pas=v[c.pas], pad=v[c.pad];
    const pam = (pas!==''&&pas!=null&&pad!==''&&pad!=null)
      ? Math.round((Number(pas)+2*Number(pad))/3) : null;
    return (
      <div className="num campo-pa">
        <label>{c.lab}</label>
        <div className="pa-linha">
          <input type="number" inputMode="numeric" placeholder="PAS" aria-label="Pressão sistólica"
            value={pas??''} onChange={e=>set(c.pas,e.target.value)}/>
          <span className="pa-x">×</span>
          <input type="number" inputMode="numeric" placeholder="PAD" aria-label="Pressão diastólica"
            value={pad??''} onChange={e=>set(c.pad,e.target.value)}/>
          <span className="pa-pam" data-on={pam!=null?'1':'0'}>
            {pam!=null ? <>PAM <b>{pam}</b></> : 'PAM'}
          </span>
        </div>
      </div>
    );
  }
  return (
    <div className="num">
      <label htmlFor={c.id}>{c.lab}</label>
      <input id={c.id} type={c.tipo==='num'?'number':'text'} inputMode={c.tipo==='num'?'decimal':'text'}
        value={v[c.id]??''} onChange={e=>set(c.id,e.target.value)}/>
    </div>
  );
}

// Um campo com "dep" so aparece quando a opcao que o exige esta marcada.
function visivel(c,v){
  if(!c.dep) return true;
  const alvo=[].concat(c.dep.valor);
  const atual=v[c.dep.campo];
  return Array.isArray(atual) ? atual.some(x=>alvo.includes(x)) : alvo.includes(atual);
}
function Secao({sec,v,set,semTitulo}){
  const campos=sec.campos.filter(c=>visivel(c,v));
  const blocos=[]; let linha=[];
  campos.forEach(c=>{
    if(c.tipo==='pa'){ if(linha.length){blocos.push({linha});linha=[];} blocos.push({campo:c}); }
    else if(c.tipo==='num'||c.tipo==='texto'){ linha.push(c); }
    else { if(linha.length){blocos.push({linha});linha=[];} blocos.push({campo:c}); }
  });
  if(linha.length) blocos.push({linha});
  return (
    <fieldset>
      {!semTitulo && <legend>{sec.tit}</legend>}
      {blocos.map((b,i)=> b.campo
        ? <Campo key={b.campo.id} c={b.campo} v={v} set={set}/>
        : <div className="linha-num" key={'l'+i}>
            {b.linha.map(c=><Campo key={c.id} c={c} v={v} set={set}/>)}
          </div>)}
    </fieldset>
  );
}

function Folha({texto}){
  const lacunas=(texto.match(/____/g)||[]).length;
  return (
    <div>
      <div className="folha-cab">
        <span>Texto para o prontuário</span>
        <span>{texto.length} caracteres</span>
      </div>
      <div className="folha">{texto}</div>
      {lacunas>0 &&
        <div className="aviso alerta">
          {lacunas} lacuna{lacunas>1?'s':''} em branco no texto. Volte e preencha antes de colar —
          o campo aparece assim que você marca o item que precisa dele.
        </div>}
      <div className="aviso">
        Texto sem formatação, pronto para colar em MV, Tasy, Soul ou similar.
        Confira antes de assinar — o registro oficial é o prontuário.
      </div>
    </div>
  );
}

/* ---------- Quadro ---------- */
function Quadro({pacientes,arquivados,ir,largo,filtro,setFiltro,uid,equipes,
                 escopos,escopo,setEscopo,moverEscopo,moverStatus,novaEquipe,seguir}){
  const contar=s=>pacientes.filter(p=>p.status===s).length;
  const [arrastando,setArrastando]=useState(null);
  const [sobre,setSobre]=useState(null);
  const porId=id=>pacientes.find(p=>p.id===id)||arquivados.find(p=>p.id===id);
  const nomeEquipe=id=>(equipes.find(e=>e.id===id)||{}).nome||'equipe';

  const dragProps=p=>({
    draggable:true,
    onDragStart:e=>{ e.dataTransfer.setData('text/plain',p.id); e.dataTransfer.effectAllowed='move'; setArrastando(p.id); },
    onDragEnd:()=>{ setArrastando(null); setSobre(null); },
  });
  const dropProps=(alvo,acao)=>({
    onDragOver:e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; if(sobre!==alvo) setSobre(alvo); },
    onDragLeave:e=>{ if(!e.currentTarget.contains(e.relatedTarget) && sobre===alvo) setSobre(null); },
    onDrop:e=>{ e.preventDefault(); const id=e.dataTransfer.getData('text/plain')||arrastando; const p=porId(id);
                setSobre(null); setArrastando(null); if(p) acao(p); },
  });

  // Funcoes de render (nao componentes): nao remontam a cada estado, entao o arrastar nao quebra.
  const cartao=p=>{
    const dih=diasDe(p.admissao);
    const pend=(p.pendencias||[]).filter(x=>!x.feito).length;
    const nd=(p.dispositivos||[]).length;
    const segue=(p.seguidores||[]).includes(uid);
    return (
      <div className="cartao" key={p.id} data-arrastando={arrastando===p.id?'1':'0'} {...(largo?dragProps(p):{})}
        role="button" tabIndex={0} onClick={()=>ir({tela:'ficha',id:p.id})}
        onKeyDown={e=>e.key==='Enter'&&ir({tela:'ficha',id:p.id})}>
        <div className="leito"><small>LEITO</small>{p.leito}</div>
        <div className="cartao-corpo">
          <div className="cartao-nome">{p.iniciais}<em>{p.idade?p.idade+'a':''}</em>
            {escopo==='pessoal' && p.equipeId && <span className="pulseira p-dih" style={{marginLeft:6}}>👥 {nomeEquipe(p.equipeId)}</span>}
          </div>
          <div className="cartao-dx">{p.dx||'sem diagnóstico registrado'}</div>
          <div className="pulseiras">
            {dih && <span className="pulseira p-dih">{dih}º DIH</span>}
            {p.alergia && <span className="pulseira p-alergia">Alergia</span>}
            {p.riscoQueda && <span className="pulseira p-queda">Risco de queda</span>}
            {p.lpp && <span className="pulseira p-lpp">LPP</span>}
            {pend>0 && <span className="pulseira p-pend">{pend} pendência{pend>1?'s':''}</span>}
            {nd>0 && <span className="pulseira p-pend">{nd} dispositivo{nd>1?'s':''}</span>}
          </div>
        </div>
        {escopo!=='pessoal' && p.userId!==uid &&
          <button className="estrela" data-on={segue?'1':'0'} title={segue?'Sai da sua aba':'Mostrar em Meus pacientes'}
            onClick={e=>{e.stopPropagation();seguir(p);}}>{segue?'★':'☆'}</button>}
      </div>
    );
  };

  const abas=(
    <div className="abas">
      {escopos.map(e=>(
        <button key={e.id} className="aba" data-on={escopo===e.id?'1':'0'} data-sobre={sobre==='aba:'+e.id?'1':'0'}
          onClick={()=>{setEscopo(e.id); if(filtro==='arquivados') setFiltro('todos');}}
          {...(largo?dropProps('aba:'+e.id, p=>moverEscopo(p,e.id)):{})}>
          <span className="aba-ico">{e.id==='pessoal'?'🗂️':'👥'}</span>
          <span>{e.nome}</span>
          {e.total!=null && <b>{e.total}</b>}
        </button>
      ))}
      <button className="aba nova" onClick={novaEquipe}>+ equipe</button>
      <span style={{flex:1}}/>
      {largo && arrastando
        ? <span className="aba-dica">solte numa coluna (situação) ou numa aba (ambiente)</span>
        : <button className="aba arq" data-on={filtro==='arquivados'?'1':'0'} onClick={()=>setFiltro(filtro==='arquivados'?'todos':'arquivados')}>
            Arquivados <b>{arquivados.length}</b></button>}
    </div>
  );

  if(largo) return (
    <div className="quadro">
      {abas}
      {filtro==='arquivados'
        ? <div className="lista-larga">{arquivados.map(cartao)}
            {arquivados.length===0 && <div className="vazio">Nenhum arquivado neste ambiente.</div>}</div>
        : <div className="colunas">
            {STATUS.map(s=>(
              <div className="coluna" key={s.v} data-sobre={sobre==='col:'+s.v?'1':'0'}
                {...dropProps('col:'+s.v, p=>p.status!==s.v&&moverStatus(p,s.v))}>
                <div className="coluna-tit"><span>{s.l}</span><span>{contar(s.v)}</span></div>
                {pacientes.filter(p=>p.status===s.v).map(cartao)}
                {contar(s.v)===0 && <div className="vazio">{arrastando?'Solte aqui':'—'}</div>}
              </div>
            ))}
          </div>}
    </div>
  );

  const lista=filtro==='arquivados'?arquivados:(filtro==='todos'?pacientes:pacientes.filter(p=>p.status===filtro));
  return (
    <>
      <div style={{padding:'10px 16px 0'}}>{abas}</div>
      <div className="chips">
        <button className="chip" data-on={filtro==='todos'?'1':'0'} onClick={()=>setFiltro('todos')}>
          Todos<b>{pacientes.length}</b></button>
        {STATUS.map(s=>(
          <button key={s.v} className="chip" data-on={filtro===s.v?'1':'0'} onClick={()=>setFiltro(s.v)}>
            {s.l}<b>{contar(s.v)}</b></button>
        ))}
      </div>
      <div className="quadro">
        {lista.map(cartao)}
        {lista.length===0 && <div className="vazio">Nenhum paciente aqui. Toque em “Novo paciente” para começar.</div>}
      </div>
    </>
  );
}

/* ---------- Ficha ---------- */
function Ficha({p,perfil,uid,autor,equipes,ir,atualizar,aviso,editar,arquivar,remover,moverEscopo,seguir}){
  const arquivo=useRef(null);
  const [nota,setNota]=useState('');
  const [addDisp,setAddDisp]=useState(null);   // {tipo,local,desde}
  const [addAtb,setAddAtb]=useState(null);     // {nome,desde}
  const [subindo,setSubindo]=useState(false);
  const ehEnf=perfil==='enfermagem';
  const dih=diasDe(p.admissao);
  const hoje=new Date().toISOString().slice(0,10);

  async function anexar(e){
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    setSubindo(true); aviso('comprimindo…');
    try{
      const blob=await comprimir(f);
      const fid=uid_();
      aviso('enviando '+Math.round(blob.size/1024)+' KB…');
      const {url,caminho}=await nuvem.subirFoto(uid,p.id,fid,blob);
      atualizar({...p, fotos:[{id:fid,url,caminho,kb:Math.round(blob.size/1024),quando:new Date().toISOString()},...(p.fotos||[])]});
      aviso('foto salva');
    }catch(err){ console.error(err); aviso('falha ao enviar a foto'); }
    setSubindo(false);
  }
  function apagarFoto(f){
    if(!confirm('Apagar esta foto?')) return;
    nuvem.apagarFoto(f.caminho);
    atualizar({...p, fotos:(p.fotos||[]).filter(x=>x.id!==f.id)});
  }
  function novaPendencia(){
    const t=prompt('Nova pendência:');
    if(t) atualizar({...p, pendencias:[...(p.pendencias||[]),{id:uid_(),texto:t,feito:false}]});
  }
  function alternar(id){
    atualizar({...p, pendencias:(p.pendencias||[]).map(x=>x.id===id?{...x,feito:!x.feito}:x)});
  }
  function salvarNota(){
    const t=nota.trim(); if(!t) return;
    atualizar({...p, evolucoes:[{id:uid_(),tipo:'nota',texto:t,resumo:t.slice(0,80),autor,quando:new Date().toISOString()},...(p.evolucoes||[])]});
    setNota(''); aviso('nota salva');
  }
  function confirmarDisp(){
    if(!addDisp.tipo) return;
    atualizar({...p, dispositivos:[...(p.dispositivos||[]),{id:uid_(),...addDisp}]});
    setAddDisp(null);
  }
  function confirmarAtb(){
    if(!addAtb.nome.trim()) return;
    atualizar({...p, antibioticos:[...(p.antibioticos||[]),{id:uid_(),...addAtb}]});
    setAddAtb(null);
  }
  const tipoEvo = ehEnf?'enfermagem':'médica';
  const minhas=(p.evolucoes||[]).filter(e=>e.tipo===tipoEvo||e.tipo==='nota');

  return (
    <>
      <div className="ficha">
        <div className="ficha-topo">
          <div className="leito"><small>LEITO</small>{p.leito}</div>
          <div style={{flex:1}}>
            <h1>{p.iniciais}</h1>
            <div className="ficha-meta">
              {p.idade?p.idade+' anos · ':''}{p.registro?'reg. '+p.registro+' · ':''}{dih?dih+'º DIH':''}
            </div>
          </div>
          <button className="btn sec mono" style={{padding:'8px 12px'}} onClick={editar}>Editar</button>
        </div>
        <div className="pulseiras" style={{marginBottom:14}}>
          {p.alergia && <span className="pulseira p-alergia">Alergia: {p.alergia}</span>}
          {p.riscoQueda && <span className="pulseira p-queda">Risco de queda</span>}
          {p.lpp && <span className="pulseira p-lpp">LPP</span>}
          {p.status==='uti' && <span className="pulseira p-pend">UTI</span>}

        </div>
        {p.dx && <div className="item"><div className="item-cab"><span>DIAGNÓSTICO</span></div><p>{p.dx}</p></div>}
        {p.problemas && <div className="item"><div className="item-cab"><span>LISTA DE PROBLEMAS</span></div><p>{p.problemas}</p></div>}

/* ---------- Construtor de evolução (passo a passo no celular) ---------- */
const VITAIS=['pas','pad','fc','fr','tax','sat','hgt','diu','bh','spo2','o2','glasgow','eva','tec','debito','peso'];
function secaoPreenchida(sec,v){
  return sec.campos.some(c=>{ const x=v[c.id]; return Array.isArray(x)?x.length>0:(x!==undefined&&x!==''&&x!==null); });
}

function Evolucao({p,tipo,autor,ir,atualizar,aviso,largo,proximo}){
  const rasc = p.rascunho && p.rascunho.tipo===tipo ? p.rascunho : null;
  const [v,setV]=useState(()=> rasc ? rasc.v : prefill(p,tipo));
  const [recuperado,setRecuperado]=useState(!!rasc);
  const [pronto,setPronto]=useState(false);
  const [extra,setExtra]=useState(false);
  const [uti,setUti]=useState(p.status==='uti');
  const [passo,setPasso]=useState(0);
  const [verTudo,setVerTudo]=useState(false);
  const set=(k,val)=>setV(o=>({...o,[k]:val}));
  const esquema = tipo==='enfermagem' ? SAE : SOAP.filter(s=>s.id!=='uti'||uti);
  const texto = useMemo(
    ()=> tipo==='enfermagem'?gerarSAE(p,v,extra):gerarSOAP(p,v,extra),
    [p,v,tipo,extra]);
  const ultima = (p.evolucoes||[]).find(e=>e.tipo===tipo && e.respostas);

  // Rascunho automatico: 1,5 s depois do ultimo toque, grava no paciente.
  // Sobrevive a fechar o app e aparece no computador tambem.
  const primeiro=useRef(true);
  useEffect(()=>{
    if(primeiro.current){ primeiro.current=false; return; }
    const t=setTimeout(()=>{
      atualizar({...p, rascunho:{tipo, v, quando:new Date().toISOString()}});
    },1500);
    return ()=>clearTimeout(t);
  },[v]); // eslint-disable-line

  function repetirUltima(){
    if(!ultima) return;
    const base={...prefill(p,tipo), ...ultima.respostas};
    VITAIS.forEach(k=>delete base[k]);
    delete base.sub; delete base.slivre; delete base.efalt; delete base.lab; delete base.img; delete base.obs;
    setV(base); setRecuperado(false);
    aviso('copiado da última evolução — confira o que mudou');
  }
  function salvarRascunho(){
    atualizar({...p, rascunho:{tipo, v, quando:new Date().toISOString()}});
    aviso('salvo');
    proximo();
  }
  function descartar(){
    if(!confirm('Descartar o rascunho e começar do zero?')) return;
    setV(prefill(p,tipo)); setRecuperado(false); setPasso(0);
    atualizar({...p, rascunho:null});
  }
  async function salvarFinal(){
    const ok=await copiar(texto);
    aviso(ok?'copiado e salvo':'salvo — copie pela linha do tempo');
    const acha=(esq,id,val)=>{
      for(const s of esq) for(const c of s.campos)
        if(c.id===id) return ((c.opts||[]).find(o=>o.v===val)||{}).l;
    };
    const resumo=(tipo==='enfermagem'
      ? (v.consc?acha(SAE,'consc',v.consc):'avaliado')
      : (v.aval?acha(SOAP,'aval',v.aval):'avaliado'));
    atualizar({...p, rascunho:null,
      evolucoes:[{id:uid_(),tipo,texto,resumo,respostas:v,autor,quando:new Date().toISOString()},...(p.evolucoes||[])]});
    ir({tela:'ficha',id:p.id});
  }

  if(pronto) return (
    <>
      <div className="form">
        <div className="campo">
          <span className="campo-lab">Formato</span>
          <div className="opcoes">
            <button className="op" data-on={!extra?'1':'0'} onClick={()=>setExtra(false)}>
              {tipo==='enfermagem'?'Evolução corrida':'Evolução'}</button>
            <button className="op" data-on={extra?'1':'0'} onClick={()=>setExtra(true)}>
              {tipo==='enfermagem'?'Corrida + diagnósticos NANDA':'Com linha de assinatura'}</button>
          </div>
        </div>
        <Folha texto={texto}/>
      </div>
      <div className="barra">
        <button className="btn sec" onClick={()=>setPronto(false)}>Voltar e ajustar</button>
        <button className="btn" onClick={salvarFinal}>Copiar e salvar</button>
      </div>
    </>
  );

  const wizard = !largo && !verTudo;
  const sec = esquema[Math.min(passo,esquema.length-1)];
  const ultimoPasso = passo>=esquema.length-1;

  return (
    <>
      <div className="form" style={{paddingTop:10}}>
        <div className="evo-cab">
          <div className="ficha-meta">Leito {p.leito} · {p.iniciais} · evolução {tipo}</div>
          <div className="evo-acoes">
            {ultima && <button className="link" onClick={repetirUltima}>↺ repetir última</button>}
            <button className="link" onClick={()=>setPronto(true)}>gerar texto</button>
            {tipo!=='enfermagem' && <button className="link" onClick={()=>setUti(!uti)}>{uti?'✓ UTI':'+ UTI'}</button>}
            {!largo && <button className="link" onClick={()=>setVerTudo(!verTudo)}>{verTudo?'passo a passo':'ver tudo'}</button>}
          </div>
        </div>
        {recuperado &&
          <div className="aviso" style={{marginTop:0,marginBottom:12,display:'flex',gap:10,alignItems:'center'}}>
            <span style={{flex:1}}>Rascunho de {new Date(rasc.quando).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} recuperado.</span>
            <button className="link" onClick={descartar}>descartar</button>
          </div>}

        {wizard ? (
          <>
            <div className="passos">
              {esquema.map((s,i)=>(
                <button key={s.id} className="passo" data-on={i===passo?'1':'0'} data-ok={secaoPreenchida(s,v)?'1':'0'}
                  onClick={()=>setPasso(i)} aria-label={s.tit}>
                  <span className="passo-n">{i+1}</span>
                </button>
              ))}
            </div>
            <div className="passo-tit">{sec.tit}<small>{passo+1} de {esquema.length}</small></div>
            <Secao key={sec.id} sec={sec} v={v} set={set} semTitulo/>
          </>
        ) : esquema.map(s=><Secao key={s.id} sec={s} v={v} set={set}/>)}
      </div>

      <div className="barra">
        {wizard ? (
          <>
            <button className="btn sec mono" style={{flex:'0 0 auto',padding:'12px 14px'}} aria-label={passo===0?'voltar à ficha':'passo anterior'}
              onClick={()=>passo===0?ir({tela:'ficha',id:p.id}):setPasso(passo-1)}>{passo===0?'✕':'‹'}</button>
            <button className="btn sec" onClick={salvarRascunho}>Salvar</button>
            {ultimoPasso
              ? <button className="btn" onClick={()=>setPronto(true)}>Gerar texto</button>
              : <button className="btn" onClick={()=>setPasso(passo+1)}>Próxima</button>}
          </>
        ) : (
          <>
            <button className="btn sec mono" style={{flex:'0 0 auto',padding:'12px 14px'}} onClick={()=>ir({tela:'ficha',id:p.id})}>✕</button>
            <button className="btn sec" onClick={salvarRascunho}>Salvar</button>
            <button className="btn" onClick={()=>setPronto(true)}>Gerar texto</button>
          </>
        )}
      </div>
    </>
  );
}

/* ---------- Instalar na tela inicial ---------- */
function usarInstalacao(){
  const [evt,setEvt]=useState(null);
  const [instalado,setInstalado]=useState(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true);
  useEffect(()=>{
    const f=e=>{e.preventDefault();setEvt(e);}; const g=()=>setInstalado(true);
    window.addEventListener('beforeinstallprompt',f); window.addEventListener('appinstalled',g);
    return ()=>{window.removeEventListener('beforeinstallprompt',f);window.removeEventListener('appinstalled',g);};
  },[]);
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return {instalado, ios, podePrompt:!!evt, instalar:async()=>{ if(evt){ evt.prompt(); await evt.userChoice; setEvt(null);} }};
}

  const [porEquipe,setPorEquipe]=useState({});
  const [escopo,setEscopo]=useState(()=>localStorage.getItem('ronda.escopo')||'pessoal');
  const [nav,setNav]=useState({tela:'quadro'});
  const [filtro,setFiltro]=useState('todos');
  const [modal,setModal]=useState(null);         // null | 'novo' | {editar:p}
  const [config,setConfig]=useState(false);
  const [toast,setToast]=useState('');
  const [largo,setLargo]=useState(window.innerWidth>=900);
  const [online,setOnline]=useState(navigator.onLine);
  const inst=usarInstalacao();

  useEffect(()=>auth.onAuthStateChanged(async u=>{
    if(!u){ setUser(null); setUsuario(null); setMeus(null); setEquipes([]); setPorEquipe({}); setBloqueado(false); return; }
    const ok=await nuvem.autorizado(u.email);
    if(!ok){ setBloqueado(true); setUser(u); return; }
    setBloqueado(false);
    setUsuario((await nuvem.lerUsuario(u.uid))||{});
    setUser(u);
  }),[]);

  useEffect(()=>{
    if(!user||bloqueado||!usuario) return;
    const erro=e=>{console.warn(e);setToast('erro ao sincronizar');};
    const off1=nuvem.ouvirMeus(user.uid, setMeus, erro);
    const off2=nuvem.ouvirEquipes(user.uid, setEquipes, erro);
    return ()=>{off1();off2();};
  },[user,bloqueado,usuario]);
  const idsEquipes=equipes.map(e=>e.id).sort().join(',');
  useEffect(()=>{
    if(!user||bloqueado||!usuario) return;
    const offs=equipes.map(e=>nuvem.ouvirEquipe(e.id, lista=>setPorEquipe(o=>({...o,[e.id]:lista})), e2=>console.warn(e2)));
    return ()=>offs.forEach(f=>f());
  },[idsEquipes,user,bloqueado,usuario]); // eslint-disable-line
  useEffect(()=>{ localStorage.setItem('ronda.escopo',escopo); },[escopo]);
  // escopo apontando para equipe que deixei de ver -> volta para o pessoal
  useEffect(()=>{ if(escopo!=='pessoal'&&equipes.length&&!equipes.find(e=>e.id===escopo)) setEscopo('pessoal'); },[idsEquipes]); // eslint-disable-line
  // Une tudo sem duplicar (um paciente meu numa equipe aparece nas duas consultas)
  const pacientes=useMemo(()=>{
    if(meus===null) return null;
    const m={}; meus.forEach(p=>m[p.id]=p);
    Object.values(porEquipe).forEach(l=>l.forEach(p=>m[p.id]=p));
    return Object.values(m);
  },[meus,porEquipe]);

  // Limpeza automatica dos arquivados antigos (fotos inclusive)
  useEffect(()=>{
    if(!pacientes||!user) return;
    pacientes.filter(p=>p.arquivado&&p.arquivadoEm&&Date.now()-p.arquivadoEm>ARQUIVO_DIAS*DIA)
      .forEach(p=>{ (p.fotos||[]).forEach(f=>nuvem.apagarFoto(f.caminho)); nuvem.removerPaciente(p.id); });
  },[pacientes,user]);

  useEffect(()=>{
    const f=()=>setLargo(window.innerWidth>=900);
    const on=()=>setOnline(true), off=()=>setOnline(false);
    window.addEventListener('resize',f); window.addEventListener('online',on); window.addEventListener('offline',off);
    return ()=>{window.removeEventListener('resize',f);window.removeEventListener('online',on);window.removeEventListener('offline',off);};
  },[]);
  useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(''),2200); return ()=>clearTimeout(t); },[toast]);
  useEffect(()=>{ window.scrollTo(0,0); },[nav]);

  if(user===undefined)
    return <div className="carregando"><div className="marca">Ronda<span>.</span></div></div>;
  if(user===null) return <Login/>;
  if(bloqueado) return <Bloqueado email={user.email}/>;
  if(!usuario) return <div className="carregando"><div className="marca">Ronda<span>.</span></div></div>;

  const definirPerfil=perfil=>{ const u={...usuario,perfil}; setUsuario(u); nuvem.salvarUsuario(user.uid,{perfil}); setConfig(false); };
  const definirUnidade=unidade=>{ const u={...usuario,unidade}; setUsuario(u); nuvem.salvarUsuario(user.uid,{unidade}); };
  if(!usuario.perfil) return <EscolherPerfil escolher={definirPerfil}/>;

  if(pacientes===null)
    return <div className="carregando"><div className="marca">Ronda<span>.</span></div></div>;

  const perfil=usuario.perfil, ehEnf=perfil==='enfermagem';
  const ordenar=l=>[...l].sort((a,b)=>String(a.leito).localeCompare(String(b.leito),'pt',{numeric:true}));
  const meu=p=> p.userId===user.uid || (p.seguidores||[]).includes(user.uid);
  const noEscopo=p=> escopo==='pessoal' ? meu(p) : p.equipeId===escopo;
  const escopos=[{id:'pessoal',nome:'Meus pacientes',total:pacientes.filter(p=>!p.arquivado&&meu(p)).length},
    ...equipes.map(e=>({id:e.id,nome:e.nome,total:pacientes.filter(p=>!p.arquivado&&p.equipeId===e.id).length}))];
  const moverEscopo=(p,id)=>{ const eq=id==='pessoal'?null:id; if((p.equipeId||null)===eq) return;
    salvar({...p,equipeId:eq}); setToast(eq?'movido para '+(equipes.find(e=>e.id===eq)||{}).nome:'movido para Meus pacientes'); };
  const moverStatus=(p,st)=>salvar({...p,status:st});
  const seguir=p=>{ const seg=p.seguidores||[]; const on=seg.includes(user.uid);
    salvar({...p,seguidores:on?seg.filter(x=>x!==user.uid):[...seg,user.uid]});
    setToast(on?'saiu da sua aba':'agora aparece em Meus pacientes'); };
  const ativos=ordenar(pacientes.filter(p=>!p.arquivado&&noEscopo(p)));
  const arquivados=ordenar(pacientes.filter(p=>p.arquivado&&noEscopo(p)));
  const atual=pacientes.find(p=>p.id===nav.id);
  const idxAtual=ativos.findIndex(x=>x.id===nav.id);
  const prox=idxAtual>=0&&idxAtual<ativos.length-1?ativos[idxAtual+1]:null;
  const irProximo=()=>{
    if(prox){ setNav({tela:'ficha',id:prox.id}); setToast('próximo: leito '+prox.leito); }
    else { setNav({tela:'quadro'}); setToast('fim da ronda'); }
  };

  const salvar=p=>nuvem.salvarPaciente(user.uid,p).catch(e=>{console.error(e);setToast('não foi possível salvar');});
  const criar=f=>salvar({...f,id:uid_(),status:'ativo',evolucoes:[],pendencias:[],fotos:[],dispositivos:[],antibioticos:[],
    equipeId:escopo==='pessoal'?null:escopo,criadoEm:Date.now()});
  const autor=user.email;
  const arquivar=p=>{ if(!confirm('Dar alta / arquivar '+p.iniciais+'?')) return; salvar({...p,arquivado:true,arquivadoEm:Date.now()}); setNav({tela:'quadro'}); setToast('arquivado'); };
  const remover=p=>{ if(!confirm('Excluir '+p.iniciais+' e todas as evoluções e fotos? Não dá para desfazer.')) return;
    (p.fotos||[]).forEach(f=>nuvem.apagarFoto(f.caminho)); nuvem.removerPaciente(p.id); setNav({tela:'quadro'}); setToast('excluído'); };
  const compartilhar=async(texto,titulo)=>{
    if(navigator.share){ try{ await navigator.share({title:titulo,text:texto}); return; }catch(e){} }
    setToast(await copiar(texto)?'copiado':'falhou — selecione o texto');
  };

  return (
    <div className="app">
      <header className="topo">
        {nav.tela==='quadro'
          ? <div className="marca">Ronda<span>.</span></div>
          : <button className="voltar" onClick={()=>setNav(
              nav.tela==='evo'?{tela:'ficha',id:nav.id}:{tela:'quadro'})}>← voltar</button>}
        {!online && <span className="selo" data-urg="1">offline · salvando no aparelho</span>}
        <div className="topo-sub">
          {nav.tela==='quadro'
            ? <button className="perfil-tag" onClick={()=>setConfig(true)}>
                {(usuario.unidade||(ehEnf?'Enfermagem':'Médico'))} ▾</button>
            : (atual
                ? (nav.tela==='ficha' && prox
                    ? <button className="perfil-tag" onClick={irProximo}>Leito {atual.leito} · próximo ›</button>
                    : 'Leito '+atual.leito)
                : '')}
        </div>
      </header>

      {nav.tela==='quadro' &&
        <Quadro pacientes={ativos} arquivados={arquivados} uid={user.uid} equipes={equipes}
          ir={setNav} largo={largo} filtro={filtro} setFiltro={setFiltro}
          escopos={escopos} escopo={escopo} setEscopo={setEscopo}
          moverEscopo={moverEscopo} moverStatus={moverStatus} seguir={seguir} novaEquipe={()=>setConfig(true)}/>}
      {nav.tela==='ficha' && atual &&
        <Ficha p={atual} perfil={perfil} uid={user.uid} autor={autor} equipes={equipes} moverEscopo={moverEscopo} seguir={seguir} ir={setNav} atualizar={salvar} aviso={setToast}
          editar={()=>setModal({editar:atual})} arquivar={()=>arquivar(atual)} remover={()=>remover(atual)}/>}
      {nav.tela==='evo' && atual &&
        <Evolucao p={atual} tipo={nav.tipo} autor={autor} ir={setNav} atualizar={salvar} aviso={setToast} largo={largo} proximo={irProximo}/>}
      {nav.tela==='plantao' &&
        <div className="form"><Folha texto={gerarPassagem(ativos,perfil)}/></div>}

      {nav.tela==='quadro' &&
        <div className="barra">
          <button className="btn sec" onClick={()=>setNav({tela:'plantao'})}>Passagem de plantão</button>
          <button className="btn" onClick={()=>setModal('novo')}>Novo paciente</button>
        </div>}
      {nav.tela==='plantao' &&
        <div className="barra">
          <button className="btn sec" onClick={()=>setNav({tela:'quadro'})}>Voltar</button>
          <button className="btn sec" onClick={async()=>setToast(await copiar(gerarPassagem(ativos,perfil))?'copiado':'falhou')}>Copiar</button>
          <button className="btn" onClick={()=>compartilhar(gerarPassagem(ativos,perfil),'Passagem de plantão')}>Enviar ao preceptor</button>
        </div>}

      {modal==='novo' && <FormPaciente fechar={()=>setModal(null)} salvar={criar} equipes={equipes} equipeId={escopo==='pessoal'?null:escopo}/>}
      {modal&&modal.editar && <FormPaciente inicial={modal.editar} fechar={()=>setModal(null)} salvar={f=>salvar({...modal.editar,...f})} equipes={equipes}/>}

      {config &&
        <div className="fundo" onClick={()=>setConfig(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h2>Configurações</h2>
            <div className="ficha-meta" style={{marginBottom:14}}>{user.email}</div>
            <span className="campo-lab">Nome da unidade (aparece no topo e no plantão)</span>
            <input defaultValue={usuario.unidade||''} placeholder="ex.: Clínica Médica · Ala B"
              onBlur={e=>definirUnidade(e.target.value.trim())} style={{marginBottom:14}}/>
            <Equipes equipes={equipes} uid={user.uid} email={user.email} aviso={setToast}
              usarEscopo={id=>{setEscopo(id);setConfig(false);}}/>
            <span className="campo-lab">Perfil de trabalho</span>
            <div className="opcoes" style={{marginBottom:14}}>
              <button className="op" data-on={ehEnf?'1':'0'} onClick={()=>definirPerfil('enfermagem')}>Enfermagem</button>
              <button className="op" data-on={!ehEnf?'1':'0'} onClick={()=>definirPerfil('medica')}>Médico</button>
            </div>
            {!inst.instalado && (inst.podePrompt
              ? <button className="btn" style={{width:'100%',marginBottom:10}} onClick={inst.instalar}>Adicionar à tela inicial</button>
              : <div className="aviso" style={{marginTop:0,marginBottom:10}}>
                  {inst.ios
                    ? 'Para instalar no iPhone: toque em Compartilhar (□↑) e depois em “Adicionar à Tela de Início”.'
                    : 'Para instalar: menu do navegador (⋮) → “Instalar app” ou “Adicionar à tela inicial”.'}
                </div>)}
            <button className="btn sec" style={{width:'100%',marginBottom:10}} onClick={()=>setConfig(false)}>Fechar</button>
            <button className="btn sec" style={{width:'100%',color:'var(--vermelho)'}} onClick={()=>auth.signOut()}>Sair da conta</button>
          </div>
        </div>}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

if('serviceWorker' in navigator && location.protocol==='https:')
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
